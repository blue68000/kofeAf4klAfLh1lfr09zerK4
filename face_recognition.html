<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>顔認識＆GASスプレッドシート連携アプリ</title>
  <!-- face-api.js の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <link rel="stylesheet" href="./src/style.css" type="text/css">

</head>
<body>

  <div id="status">システム初期化中...</div>
  <div id="result-message">誰かを待っています...</div>
  
  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div id="register-panel">
    <input type="text" id="name-input" placeholder="未登録の顔に登録する名前">
    <button id="reg-btn" disabled>この顔を登録</button>
  </div>

  <script src="./src/face_recognition.js"></script>
</body>
</html>
