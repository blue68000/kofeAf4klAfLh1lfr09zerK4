<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム物体検知</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #121212;
      color: white;
      font-family: sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      max-width: 640px;
      height: calc(100vw * 0.75);
      max-height: 480px;
      margin-top: 20px;
    }
    /* カメラ映像と描画用キャンバスをぴったり重ねる */
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="status">モデルを読み込んでいます...</div>
  
  <div id="container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');

    let model;

    // 英語から日本語への変換辞書を用意する
    const labelMap = {
      'person': '人',
      'cell phone': 'スマホ',
      'laptop': 'ノートPC',
      'mouse': 'マウス',
      'keyboard': 'キーボード',
      'cup': 'コップ',
      'bottle': 'ペットボトル',
      'chair': '椅子',
      'book': '本',
      'cat': '猫',
      'dog': '犬',
      'tv': 'テレビ',
      'remote': 'リモコン',
      'potted plant': '観葉植物'
      // 必要に応じて他の物体も追加できます！
    };
    
    // 1. スマホのリアカメラを起動する
    async function setupCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { exact: "environment" }, // リアカメラを指定（動作しない場合は "user" または削除）
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });
      video.srcObject = stream;

      return new Promise((resolve) => {
        video.onloadedmetadata = () => {
          resolve(video);
        };
      });
    }

    // 2. 毎フレームの物体検知と描画処理
    async function detectFrame() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    
      const predictions = await model.detect(video);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    
      predictions.forEach(prediction => {
        const [x, y, width, height] = prediction.bbox;
    
        // --- ここで日本語ラベルを取得 ---
        // 辞書にあれば日本語、なければ英語のまま表示する
        const japaneseLabel = labelMap[prediction.class] || prediction.class;
        
        // 表示用テキストの作成（例：スマホ (92%)）
        const text = `${japaneseLabel} (${Math.round(prediction.score * 100)}%)`;
    
        // 枠線の描画
        ctx.strokeStyle = '#00FF00';
        ctx.lineWidth = 4;
        ctx.strokeRect(x, y, width, height);
    
        // ラベル背景の描画
        ctx.fillStyle = '#00FF00';
        ctx.font = '18px sans-serif';
        const textWidth = ctx.measureText(text).width;
        ctx.fillRect(x, y > 25 ? y - 25 : y, textWidth + 8, 25);
    
        // ラベル文字の描画
        ctx.fillStyle = '#000000';
        ctx.fillText(text, x + 4, y > 25 ? y - 7 : y + 18);
      });
    
      requestAnimationFrame(detectFrame);
    }

    // 3. 全体の初期化処理
    async function main() {
      try {
        await setupCamera();
        statusText.innerText = 'AIモデルをロード中...';
        
        // COCO-SSDモデルの読み込み
        model = await cocoSsd.load();
        
        statusText.innerText = '検知中！カメラをかざしてみてください';
        detectFrame();
      } catch (e) {
        statusText.innerText = 'カメラの起動に失敗しました（HTTPS環境で試してください）';
        console.error(e);
      }
    }

    main();
  </script>
</body>
</html>
